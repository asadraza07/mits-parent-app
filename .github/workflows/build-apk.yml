name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build debug APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MITS-Parent.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MITS-Parent-apk
          path: MITS-Parent.apk
      - name: Publish APK as a download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: MITS Parent app (latest build)
          body: Tap MITS-Parent.apk below on an Android phone to download and install.
          files: MITS-Parent.apk
          make_latest: true
